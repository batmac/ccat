on:
  pull_request:
    types:
      - opened
  issues:
    types:
      - opened

permissions: {}

jobs:
  add-to-project:
    name: Add to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/batmac/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
