name: Go
env:
  # needed for the --check tests
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install cURL Headers
        uses: lyricwulf/abc@66857ee5082bf5a43e736fd9c54c2e545d64e7ea # v1
        with:
          linux: libcurl4-openssl-dev

      - name: Go env
        run: go env

      - name: Build
        run: go build -v -tags libcurl ./cmd/ccat

      - name: Test
        run: go test -v -tags libcurl  ./...

      - name: Coverage
        run: |
          go test -race -cover -coverprofile coverage1.out ./...
          go test -race -cover -coverprofile coverage2.out -tags libcurl,crappy  ./...

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage1.out,coverage2.out

  win:
    strategy:
      matrix:
        os: [windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true
      - run: printenv|sort
      - run: go build -v ./cmd/ccat
      #- run: go test -v ./...
